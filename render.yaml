services:
  - type: web
    name: stadie-park-backend
    runtime: python
    rootDir: backend/stadie_park_backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stadie-park-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_TTL_SECONDS
        value: 43200
      - key: CORS_ORIGINS
        value: https://stadie-park-frontend.onrender.com

  - type: web
    name: stadie-park-frontend
    runtime: static
    rootDir: Frontend/securify-hero-section
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist-render
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stadie-park-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: stadie-park-db
    plan: free
    databaseName: stadie_park
    user: stadie_park
